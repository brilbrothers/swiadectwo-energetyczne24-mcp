name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC — the API underneath can change without a commit here.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
